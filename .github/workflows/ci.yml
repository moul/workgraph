name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: configure git identity (needed by git-backed tests)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: test (race)
        run: go test -race ./...

      - name: build
        run: go build -o workgraph ./cmd/workgraph

      - name: validate example workspace (dogfood)
        run: ./workgraph -C examples/basic validate

      - name: indexes are not stale
        run: |
          ./workgraph -C examples/basic index
          if ! git diff --quiet examples/basic/indexes; then
            echo "examples/basic indexes are stale; run 'workgraph index'"; git --no-pager diff examples/basic/indexes; exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
